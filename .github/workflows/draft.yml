name: Twibot drafts

on:
  schedule:
    # Off-peak minutes, IST times. Keep in sync with SLOT_BY_CRON in src/draft.js.
    - cron: "17 4 * * *"   # 09:47 morning
    - cron: "47 7 * * *"   # 13:17 midday
    - cron: "17 12 * * *"  # 17:47 afternoon
    - cron: "47 15 * * *"  # 21:17 evening recap
  workflow_dispatch:
    inputs:
      slot:
        description: "Which slot to draft for"
        type: choice
        options: [auto, morning, midday, afternoon, evening]
        default: auto

permissions:
  contents: read
  actions: write # only for the keepalive step

# One run at a time, so Telegram updates are never read twice.
concurrency:
  group: twibot
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Draft tweet
        run: node src/draft.js
        env:
          # Inputs go through env, never ${{ }} inside run:, to avoid script injection.
          SLOT: ${{ inputs.slot }}
          SCHEDULE: ${{ github.event.schedule }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GH_USERNAME: ${{ vars.GH_USERNAME }}
          GITHUB_TOKEN: ${{ github.token }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
      # GitHub disables schedules in public repos after 60 days without commits.
      - name: Keep schedule enabled
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/draft.yml/enable" --silent
        env:
          GH_TOKEN: ${{ github.token }}
